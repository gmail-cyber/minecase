<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MineCase — кейсы Minecraft</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:linear-gradient(160deg,#e6f6ee,#e5e8fb 60%,#f2e7fb);--card:rgba(255,255,255,.8);--card2:#f1f3fa;--txt:#1c2233;--mut:#667089;--acc:#2fa05a;--gold:#b57a00;--hd:rgba(255,255,255,.94);--ln:#d9deea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:linear-gradient(160deg,#0e1f26,#171538 60%,#2a1637);--card:rgba(32,40,74,.78);--card2:#262e52;--txt:#eef1ff;--mut:#9aa4c7;--acc:#4ade80;--gold:#fbbf24;--hd:rgba(20,26,51,.95);--ln:#323b66}}
:root[data-theme="dark"]{--bg:linear-gradient(160deg,#0e1f26,#171538 60%,#2a1637);--card:rgba(32,40,74,.78);--card2:#262e52;--txt:#eef1ff;--mut:#9aa4c7;--acc:#4ade80;--gold:#fbbf24;--hd:rgba(20,26,51,.95);--ln:#323b66}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg) fixed;color:var(--txt);font:15px/1.4 Nunito,system-ui,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hd)}
.px{font-family:'Press Start 2P',ui-monospace,monospace}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--hd);backdrop-filter:blur(8px);border-bottom:1px solid var(--ln)}
h1{font-size:13px;margin:0;color:var(--acc)}
.bal{font-weight:800;color:var(--gold);background:var(--card2);padding:6px 14px;border-radius:99px;border:1px solid var(--ln)}
main{max-width:920px;margin:0 auto;padding:14px 14px 100px}
h2{font-size:15px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:14px;margin-bottom:14px;box-shadow:0 8px 24px rgba(10,10,40,.12)}
button{font:inherit;font-weight:700;cursor:pointer;color:var(--txt);background:var(--card2);border:1px solid var(--ln);border-radius:12px;padding:10px 16px;transition:transform .1s}
button:active{transform:scale(.96)}
button:disabled{opacity:.45;cursor:not-allowed}
button.go{background:linear-gradient(135deg,#34d27a,#1ba39c);color:#06210f;border:0;font-family:'Press Start 2P',ui-monospace,monospace;font-size:11px;padding:14px 18px}
button:focus-visible,.case:focus-visible,.it:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:640px){.grid{grid-template-columns:repeat(5,1fr)}}
.case{background:var(--card);border:2px solid var(--ln);border-radius:18px;padding:12px 6px;text-align:center;cursor:pointer;transition:transform .15s,border-color .15s}
.case:hover{transform:translateY(-3px)}
.case.sel{border-color:var(--gold);box-shadow:0 0 20px color-mix(in srgb,var(--gold) 45%,transparent)}
.case .big{font-size:40px;display:block}
.case b{display:block;font-size:14px;margin:4px 0 2px}
.case small{color:var(--gold);font-weight:800}
.case .tp{font-size:11px;color:var(--mut)}
.win{position:relative;height:140px;overflow:hidden;background:var(--card2);border-radius:16px;border:1px solid var(--ln)}
.win::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:var(--gold);box-shadow:0 0 12px var(--gold);z-index:2;border-radius:2px}
.track{display:flex;height:100%;will-change:transform}
.it{flex:0 0 104px;width:104px;margin:8px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:14px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 28%,var(--card2)),var(--card2));border:2px solid color-mix(in srgb,var(--c) 70%,transparent);box-shadow:0 0 14px color-mix(in srgb,var(--c) 30%,transparent);padding:6px 4px;text-align:center;color:var(--txt)}
.it .e{font-size:36px;line-height:1}
.it b{font-size:11px;line-height:1.15}
.it i{font-style:normal;font-size:11px;font-weight:800;color:var(--gold)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.res{min-height:24px;margin-top:10px;font-weight:700}
.odds{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px}
.odds span{border-left:8px solid var(--c);padding-left:6px}
.drops{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:12px}
.dr{display:flex;gap:6px;align-items:center;font-size:12px;border-left:6px solid var(--c);background:var(--card2);padding:6px;border-radius:8px}
.dr b{font-weight:700;line-height:1.2}
.dr small{margin-left:auto;color:var(--mut);white-space:nowrap}
.dr.top{outline:2px solid var(--gold)}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.inv .it{flex:none;width:auto;margin:0;height:124px;cursor:pointer}
.inv .it.sel{outline:3px solid var(--gold);outline-offset:1px}
.vs{display:grid;gap:10px}
.lab{font-size:10px;margin:0 0 6px}
select{font:inherit;font-weight:700;padding:10px;background:var(--card2);color:var(--txt);border:1px solid var(--ln);border-radius:12px}
.empty{color:var(--mut);padding:18px 6px;text-align:center;grid-column:1/-1}
.wheel{width:200px;height:200px;border-radius:50%;margin:6px auto 0;position:relative;background:conic-gradient(var(--acc) 0 var(--ch,0deg),#e25563 var(--ch,0deg) 360deg);box-shadow:0 0 24px rgba(0,0,0,.25)}
.hub{position:absolute;inset:24px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:800;font-size:20px}
.needle{position:absolute;left:50%;top:0;width:8px;height:50%;margin-left:-4px;transform-origin:bottom center;z-index:2;background:linear-gradient(to bottom,#fff 0,#fff 26px,transparent 26px);border-radius:4px;filter:drop-shadow(0 0 4px #000)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--hd);backdrop-filter:blur(8px);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:8px 2px;font-size:11px;color:var(--mut)}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--acc)}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#14182b;color:#fff;padding:10px 16px;border-radius:99px;border:1px solid var(--gold);opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;font-size:13px}
#toast.show{opacity:1}
.boom{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(6,4,14,.78);cursor:pointer}
.burst{position:absolute;left:50%;top:50%;width:340px;height:340px;margin:-170px 0 0 -170px;border-radius:50%;background:radial-gradient(circle,var(--c),transparent 68%);animation:pulse 1.2s ease-out infinite}
.boom s{position:absolute;left:50%;top:50%;width:var(--w);height:var(--w);background:var(--c);border-radius:2px;animation:fly 1.3s var(--t) ease-out both}
.gift{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 34px;border-radius:24px;background:var(--card2);border:3px solid var(--c);box-shadow:0 0 50px var(--c);animation:pop .7s cubic-bezier(.2,1.6,.4,1) both;text-align:center;color:var(--txt)}
.lg .gift{animation:pop .7s cubic-bezier(.2,1.6,.4,1) both,shake .5s .7s 2}
.gift .e{font-size:76px;line-height:1}
.gift b{font-size:18px}
.gift em{font-style:normal;font-weight:800;color:var(--c)}
.gift i{font-style:normal;font-weight:800;color:var(--gold)}
@keyframes pop{from{transform:scale(0) rotate(-12deg)}to{transform:scale(1) rotate(0)}}
@keyframes pulse{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@keyframes fly{from{transform:translate(-50%,-50%) scale(1);opacity:1}to{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(.2) rotate(240deg);opacity:0}}
@keyframes shake{25%{transform:translateX(-8px) rotate(-2deg)}75%{transform:translateX(8px) rotate(2deg)}}
@media (prefers-reduced-motion:reduce){.burst,.boom s,.gift{animation:none}.boom s{display:none}}

body{background:radial-gradient(60% 40% at 0% 0%,rgba(74,222,128,.2),transparent),radial-gradient(50% 40% at 100% 8%,rgba(168,120,255,.24),transparent),var(--bg);background-attachment:fixed}
h1{font-size:14px;background:linear-gradient(90deg,#4ade80,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{border-radius:26px;backdrop-filter:blur(10px);box-shadow:0 12px 34px rgba(8,8,40,.18)}
.case{border-radius:22px;background:linear-gradient(180deg,var(--card),var(--card2))}
.case.sel{transform:scale(1.04)}
.case img.big{width:64px;height:64px;object-fit:contain;display:block;margin:2px auto 4px;filter:drop-shadow(0 5px 5px rgba(0,0,0,.4))}
.win{border-radius:20px;box-shadow:inset 0 0 30px rgba(0,0,0,.22);-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.it{border-radius:18px}
.it img{width:52px;height:52px;object-fit:contain;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
.dr img{width:30px;height:30px;object-fit:contain;display:block}
.gift img{width:120px;height:120px;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
button.go{box-shadow:0 8px 20px rgba(34,197,128,.4)}
nav{left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-bottom:0;border:1px solid var(--ln);border-radius:24px;box-shadow:0 12px 30px rgba(0,0,0,.3);padding:4px}
nav button{font-size:10px;border-radius:18px}
nav button.on{background:color-mix(in srgb,var(--acc) 18%,transparent)}
#toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.mut{color:var(--mut);margin:0 0 6px}
.amt{display:flex;gap:8px;align-items:center;font-size:24px;margin:10px 0}
.amt input{font:inherit;font-weight:800;width:100%;padding:12px;border-radius:14px;border:1px solid var(--ln);background:var(--card2);color:var(--txt)}
#amtRange{width:100%;accent-color:var(--acc)}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.cnt{display:flex;gap:6px}.cnt button{flex:1}.cnt button.on{background:var(--acc);color:#06210f;border-color:transparent}
#reels{display:grid;gap:8px}
.win.sm{height:80px;border-radius:16px}
.win.sm .it{margin:6px 4px;gap:1px;padding:3px}
.win.sm .it b{display:none}
.win.sm .it img{width:38px;height:38px}
.win.sm .it .e{font-size:28px}
</style>
</head>
<body>
<header><h1 class="px">MINECASE</h1><div class="bal" id="bal">0</div></header>
<main>
  <section id="cases">
    <div class="grid" id="caseGrid"></div>
    <div class="card">
      <div id="reels"><div class="win"><div class="track"></div></div></div>
      <div class="cnt" id="cnt" style="margin-top:12px"></div>
      <div class="row"><button class="go" id="openBtn">Открыть</button><button id="bonus">Бонус +100 💚</button></div>
      <div class="res" id="res1">Выберите кейс и нажмите «Открыть».</div>
      <div class="inv" id="multi" style="margin-top:10px"></div>
      <div class="odds" id="odds"></div>
      <div class="drops" id="drops"></div>
    </div>
  </section>

  <section id="inv" hidden>
    <div class="card">
      <div class="row" style="margin:0 0 12px"><button id="sellAll">Продать всё</button><span id="invInfo" style="color:var(--mut)"></span></div>
      <div class="inv" id="invGrid"></div>
      <p style="color:var(--mut);font-size:12px;margin:10px 0 0">Нажмите на предмет, чтобы продать его.</p>
    </div>
  </section>

  <section id="up" hidden>
    <div class="card" style="text-align:center">
      <div class="wheel" id="wheel"><div class="hub" id="hub">—</div><div class="needle" id="needle"></div></div>
      <div class="res" id="upRes"></div>
      <button class="go" id="upGo" disabled>Апгрейд</button>
    </div>
    <div class="card"><h2>1. Что вложить</h2><div class="inv" id="upInv"></div></div>
    <div class="card"><h2>2. Что получить</h2><div class="inv" id="upTgt"></div></div>
  </section>
  <section id="coins" hidden>
    <div class="card">
      <h2>Пополнить счёт</h2>
      <p class="mut">Игровая валюта — ненастоящие деньги, пополнение бесплатное. Выберите сумму.</p>
      <div class="amt"><input id="amt" type="number" min="1" max="1000000" value="1000" inputmode="numeric" aria-label="Сумма"><span>💚</span></div>
      <input id="amtRange" type="range" min="100" max="100000" step="100" value="1000" aria-label="Сумма ползунком">
      <div class="presets" id="presets"></div>
      <button class="go" id="addCoins">Добавить</button>
      <div class="res" id="coinRes"></div>
    </div>
  </section>
</main>
<nav>
  <button data-t="cases" class="on"><span>📦</span>Кейсы</button>
  <button data-t="inv"><span>🎒</span>Предметы</button>
  <button data-t="up"><span>⚡</span>Апгрейд</button>
  <button data-t="coins"><span>💰</span>Монеты</button>
</nav>
<div id="toast" role="status"></div>

const save=()=>{try{localStorage.setItem('minecase',JSON.stringify(S))}catch(e){}};
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1800)}
const pic=i=>IMG[i.n]?`<img src="${IMG[i.n]}" alt="">`:`<span class="e">${i.e||'❔'}</span>`;
const tile=(i,a='',c='')=>`<div class="it ${c}" style="--c:${RAR[i.r][1]}" ${a}>${pic(i)}<b>${i.n}</b><i>${i.v} 💚</i></div>`;
function roll(c){let x=Math.random()*100,k=0;for(;k<4;k++){if((x-=W[k])<0)break}const l=c.items.filter(i=>i.r===KEYS[k]);return l[Math.floor(Math.random()*l.length)]}
const head=()=>{$('#bal').textContent=S.bal+' 💚'};
function give(it){S.inv.push({n:it.n,v:it.v,r:it.r,id:uid++})}
function spin(track,win,pool,ex=0){
  const N=46,IDX=38,arr=[];
  for(let i=0;i<N;i++)arr.push(i===IDX?win:pool[Math.floor(Math.random()*pool.length)]);
  track.style.transition='none';track.style.transform='translateX(0)';
  track.innerHTML=arr.map(i=>tile(i)).join('');
  const Wd=112,w=track.parentElement.clientWidth,x=IDX*Wd+Wd/2-w/2+(Math.random()-.5)*Wd*.6;
  void track.offsetWidth;
  const dur=matchMedia('(prefers-reduced-motion:reduce)').matches?.4:5+ex;
  track.style.transition=`transform ${dur}s cubic-bezier(.12,.7,.1,1)`;
  track.style.transform=`translateX(${-x}px)`;
  return new Promise(r=>setTimeout(r,dur*1000+200));
}
function celebrate(it){
  if(!'rel'.includes(it.r))return;
  const lg=it.r==='l',o=document.createElement('div');o.className='boom'+(lg?' lg':'');o.style.setProperty('--c',RAR[it.r][1]);
  let p='';for(let i=0;i<(lg?64:36);i++){const a=Math.random()*6.283,d=100+Math.random()*(lg?240:180);p+=`<s style="--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px;--t:${(Math.random()*.4).toFixed(2)}s;--w:${6+Math.random()*9}px"></s>`}
  o.innerHTML=`<div class="burst"></div>${p}<div class="gift">${pic(it)}<b>${it.n}</b><em>${RAR[it.r][0]}</em><i>${it.v} 💚</i></div>`;
  o.onclick=()=>o.remove();document.body.appendChild(o);setTimeout(()=>o.remove(),3600);
}
function renderCases(){
  $('#caseGrid').innerHTML=CASES.map((c,i)=>`<div class="case ${i===sel?'sel':''}" tabindex="0" data-i="${i}"><img class="big" src="${IMG[c.e]}" alt=""><b>${c.n}</b><small>${c.p} 💚</small><div class="tp">топ: ${topOf(c).v} 💚</div></div>`).join('');
  const c=CASES[sel],top=topOf(c);
  $('#odds').innerHTML=KEYS.map((k,i)=>`<span style="--c:${RAR[k][1]}">${RAR[k][0]} ${W[i]}%</span>`).join('');
  $('#drops').innerHTML=[...c.items].sort((a,b)=>b.v-a.v).map(i=>{const k=KEYS.indexOf(i.r),n=c.items.filter(x=>x.r===i.r).length;return `<div class="dr ${i===top?'top':''}" style="--c:${RAR[i.r][1]}"><span>${pic(i)}</span><b>${i===top?'★ ':''}${i.n}<br><small>${i.v} 💚</small></b><small>${(W[k]/n).toFixed(1)}%</small></div>`}).join('');
}
const pick=e=>{const el=e.target.closest('.case');if(el&&!busy){sel=+el.dataset.i;renderCases();updOpen()}};
$('#caseGrid').addEventListener('click',pick);
$('#caseGrid').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(e)}});
let cnt=1;
function mkReels(n){$('#reels').innerHTML=Array.from({length:n},()=>`<div class="win${n>1?' sm':''}"><div class="track"></div></div>`).join('')}
function updOpen(){const c=CASES[sel];if(!busy)mkReels(cnt);$('#openBtn').textContent=cnt>1?`Открыть ×${cnt} · ${c.p*cnt} 💚`:'Открыть';document.querySelectorAll('#cnt button').forEach(b=>b.classList.toggle('on',+b.dataset.n===cnt))}
$('#cnt').innerHTML=[1,3,5,10].map(n=>`<button data-n="${n}">×${n}</button>`).join('');
$('#cnt').onclick=e=>{const b=e.target.closest('button');if(b&&!busy){cnt=+b.dataset.n;updOpen()}};
$('#openBtn').onclick=async()=>{
  const c=CASES[sel],n=cnt,cost=c.p*n;if(busy)return;
  if(S.bal<cost){toast('Не хватает изумрудов 💚');return}
  busy=true;S.bal-=cost;head();$('#res1').textContent='Крутим…';$('#multi').innerHTML='';mkReels(n);
  const got=Array.from({length:n},()=>roll(c)),best=got.reduce((a,b)=>b.v>a.v?b:a);
  save();
  await Promise.all(got.map((x,k)=>spin(document.querySelectorAll('#reels .track')[k],x,c.items,k*.15)));
  got.forEach(x=>give(x));save();busy=false;
  const tot=got.reduce((a,b)=>a+b.v,0);
  $('#res1').innerHTML=n>1?`Выпало ${n} предметов на ${tot} 💚 (потрачено ${cost}). ${tot>=cost?'В плюсе!':'Не повезло.'}`:`Выпало: <span style="color:${RAR[best.r][1]}">${best.n}</span> (${RAR[best.r][0]}) — ${best.v} 💚. ${best.v>=c.p?'В плюсе!':'Чуть меньше цены кейса.'}`;
  renderInv();celebrate(best);
};
$('#bonus').onclick=()=>{
  const left=20000-(Date.now()-(S.last||0));
  if(left>0){toast('Бонус через '+Math.ceil(left/1000)+' с');return}
  S.bal+=100;S.last=Date.now();save();head();toast('+100 💚');
};
function renderInv(){
  const s=[...S.inv].sort((x,y)=>y.v-x.v);
  $('#invGrid').innerHTML=s.length?s.map(i=>tile(i,`tabindex="0" data-id="${i.id}"`)).join(''):'<div class="empty">Пока пусто. Откройте кейс.</div>';
  $('#invInfo').textContent=s.length?`${s.length} шт. на ${s.reduce((a,b)=>a+b.v,0)} 💚`:'';
  $('#sellAll').disabled=!s.length;
}
function sell(id){const k=S.inv.findIndex(i=>i.id===id);if(k<0)return;S.bal+=S.inv[k].v;S.inv.splice(k,1);save();head();renderInv()}
$('#invGrid').addEventListener('click',e=>{const el=e.target.closest('[data-id]');if(el)sell(+el.dataset.id)});
$('#invGrid').addEventListener('keydown',e=>{if(e.key==='Enter'){const el=e.target.closest('[data-id]');if(el)sell(+el.dataset.id)}});
$('#sellAll').onclick=()=>{const t=S.inv.reduce((a,b)=>a+b.v,0);S.bal+=t;S.inv=[];save();head();renderInv();toast('Продано на '+t+' 💚')};

function renderUp(keep){
  const items=[...S.inv].sort((a,b)=>b.v-a.v);
  up.s=new Set([...up.s].filter(id=>S.inv.some(i=>i.id===id)));
  const sum=items.filter(i=>up.s.has(i.id)).reduce((a,b)=>a+b.v,0),tg=CAT.filter(i=>i.v>sum);
  if(up.t&&!tg.some(i=>i.n+i.v===up.t))up.t=null;
  const t=tg.find(i=>i.n+i.v===up.t);
  up.ch=t&&sum?Math.round(Math.min(90,Math.max(1,sum/t.v*95))*10)/10:0;
  $('#upInv').innerHTML=items.length?items.map(i=>tile(i,`tabindex="0" data-id="${i.id}"`,up.s.has(i.id)?'sel':'')).join(''):'<div class="empty">Нет предметов. Откройте кейс.</div>';
  $('#upTgt').innerHTML=tg.map(i=>tile(i,`tabindex="0" data-k="${i.n+i.v}"`,i.n+i.v===up.t?'sel':'')).join('')||'<div class="empty">Нет предметов дороже.</div>';
  $('#wheel').style.setProperty('--ch',up.ch*3.6+'deg');
  if(!keep){const n=$('#needle');n.style.transition='none';n.style.transform='rotate(0deg)'}
  $('#hub').textContent=up.ch?up.ch+'%':'—';
  $('#upGo').disabled=!up.ch;
  $('#upRes').textContent=!sum?'Выберите предметы для вложения.':!t?'Теперь выберите цель.':`Вложено ${sum} 💚 → ${t.n} (${t.v} 💚)`;
}
const upClick=e=>{
  if(busy)return;
  const a=e.target.closest('[data-id]'),b=e.target.closest('[data-k]');
  if(a){const id=+a.dataset.id;up.s.has(id)?up.s.delete(id):up.s.add(id);renderUp()}
  else if(b){up.t=b.dataset.k;renderUp()}
};
$('#up').addEventListener('click',upClick);
$('#up').addEventListener('keydown',e=>{if(e.key==='Enter')upClick(e)});
$('#upGo').onclick=async()=>{
  if(busy||!up.ch)return;
  const t=CAT.find(i=>i.n+i.v===up.t),ch=up.ch;
  S.inv=S.inv.filter(i=>!up.s.has(i.id));save();
  busy=true;$('#upGo').disabled=true;
  const win=Math.random()*100<ch,z=ch*3.6,f=Math.random()*.9+.05,ang=1800+(win?f*z:z+f*(360-z)),n=$('#needle');
  n.style.transition='transform 4.5s cubic-bezier(.12,.7,.1,1)';n.style.transform=`rotate(${ang}deg)`;
  await new Promise(r=>setTimeout(r,4700));
  busy=false;up.s=new Set();up.t=null;
  if(win)give(t);
  save();head();renderInv();renderUp(true);
  $('#upRes').innerHTML=win?`Успех! Получен ${t.n}.`:'Не повезло — вложенные предметы сгорели.';
  if(win)celebrate(t);
};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  if(busy)return;
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  ['cases','inv','up','coins'].forEach(t=>$('#'+t).hidden=t!==b.dataset.t);
  if(b.dataset.t==='up')renderUp();
  scrollTo(0,0);
});
const clampA=v=>Math.max(1,Math.min(1000000,Math.floor(+v||0)));
$('#presets').innerHTML=[100,500,1000,5000,10000,50000].map(v=>`<button data-v="${v}">+${v}</button>`).join('');
$('#presets').onclick=e=>{const b=e.target.closest('button');if(b){$('#amt').value=b.dataset.v;$('#amtRange').value=Math.min(100000,+b.dataset.v)}};
$('#amtRange').oninput=e=>{$('#amt').value=e.target.value};
$('#amt').oninput=e=>{$('#amtRange').value=Math.min(100000,clampA(e.target.value))};
$('#addCoins').onclick=()=>{const v=clampA($('#amt').value);$('#amt').value=v;S.bal+=v;save();head();$('#coinRes').textContent=`Добавлено ${v} 💚. Баланс: ${S.bal} 💚`;toast('+'+v+' 💚')};
head();renderCases();renderInv();updOpen();
</script>
</body>
</html>
